<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Matsense Reel 5 - Same pass</title>
    <script src="assets/js/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit.css" />
    <style>
      #h1 { top: 250px; font-size: 96px; }
      .panel { position: absolute; top: 600px; width: 340px; height: 1080px; border-radius: 28px; overflow: hidden; background: #000; }
      .panel video { position: absolute; left: 0; top: 0; width: 340px; height: 1080px; object-fit: cover; }
      .panel .ring { position: absolute; inset: 0; border-radius: 28px; border: 6px solid var(--ev-guardpass-mark); box-shadow: inset 0 0 40px rgba(242, 109, 4, 0.5); opacity: 0; }
      .panel .lab { position: absolute; left: 18px; right: 18px; bottom: 22px; }
      .panel .lab .mo { font-weight: 800; font-size: 40px; letter-spacing: -0.5px; text-shadow: 0 2px 16px rgba(0, 0, 0, 0.8); }
      .panel .lab .tc { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 28px; color: var(--ink-muted); text-shadow: 0 2px 16px rgba(0, 0, 0, 0.8); }
      .panel .gp { position: absolute; left: 18px; top: 20px; font-size: 22px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; border-radius: 10px; padding: 6px 12px;
        color: var(--ev-guardpass-fg); background: var(--ev-guardpass-bg); opacity: 0; }
      .panel .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: linear-gradient(0deg, rgba(0, 0, 0, 0.75), transparent); }
      #p1 { left: 20px; } #p2 { left: 370px; } #p3 { left: 720px; }
      .mrow { position: absolute; left: 60px; right: 60px; height: 230px; border-radius: 30px; padding: 26px 34px; background: rgba(255, 255, 255, 0.07);
        border: 2px solid rgba(255, 255, 255, 0.1); }
      .mrow .t { font-weight: 800; font-size: 40px; } .mrow .s { font-family: "JetBrains Mono", monospace; font-size: 26px; color: var(--ink-muted); margin-left: 14px; }
      .mrow .st { position: relative; height: 90px; margin-top: 24px; }
      .mrow .st .ln { position: absolute; left: 0; right: 0; top: 45px; height: 2px; background: var(--border-strong); }
      .mrow .tk { position: absolute; width: 12px; border-radius: 4px; margin-left: -6px; }
      .mrow .tk.a { bottom: 47px; } .mrow .tk.b { top: 47px; }
      .lib-row { display: flex; gap: 10px; align-items: center; padding: 9px; margin-top: 8px; }
      .lib-row img { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; }
      .lib-row .t { font-weight: 800; font-size: 13px; } .lib-row .s { font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--ink-muted); margin-top: 3px; }
      .tabs3 { display: flex; gap: 6px; margin-top: 14px; }
      .tabs3 span { font-weight: 800; font-size: 13px; padding: 7px 14px; border-radius: 16px; background: var(--chip); color: var(--ink-muted); }
      .tabs3 span.sel { background: var(--cta); color: var(--on-cta); }
      #h6 { top: 520px; text-align: left; font-size: 130px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ad5" data-start="0" data-width="1080" data-height="1920" data-duration="24.8">
      <!-- 1-2. same pass, three tournaments -->
      <div class="panel" id="p1"><video id="pv-a" class="clip" src="assets/video/v_a_335z.mp4" data-start="0" data-duration="5.5" data-media-start="1.5" data-track-index="1" muted></video>
        <i class="shade"></i><span class="gp" id="gp1">Guard pass</span><div class="lab"><div class="mo">March</div><div class="tc">5:35 · No-gi</div></div><i class="ring" id="r1"></i></div>
      <div class="panel" id="p2"><video id="pv-b" class="clip" src="assets/video/v_a_102z.mp4" data-start="0" data-duration="5.5" data-media-start="2.5" data-track-index="1" muted></video>
        <i class="shade"></i><span class="gp" id="gp2">Guard pass</span><div class="lab"><div class="mo">June</div><div class="tc">1:42 · No-gi</div></div><i class="ring" id="r2"></i></div>
      <div class="panel" id="p3"><video id="pv-c" class="clip" src="assets/video/v_b_352.mp4" data-start="0" data-duration="5.5" data-media-start="0.5" data-track-index="1" muted></video>
        <i class="shade"></i><span class="gp" id="gp3">Guard pass</span><div class="lab"><div class="mo">September</div><div class="tc">5:52 · Gi</div></div><i class="ring" id="r3"></i></div>
      <section id="s1" class="clip" data-start="0" data-duration="5.5" data-track-index="3" style="position:absolute;inset:0">
        <div class="headline" id="h1"><span class="w">Same</span> <span class="w hot">pass.</span> <span class="w">Three</span> <span class="w">tournaments.</span></div>
      </section>

      <!-- 3. months of matches: three strips, the orange tick in each -->
      <section id="s3" class="clip" data-start="5.4" data-duration="4.45" data-track-index="3" style="position:absolute;inset:0">
        <div class="mrow" id="mr0" style="top:680px"><span class="t">March</span><span class="s">vs Amit · 11:25</span><div class="st" id="st0"><i class="ln"></i></div></div>
        <div class="mrow" id="mr1" style="top:950px"><span class="t">June</span><span class="s">vs Amit · 11:25</span><div class="st" id="st1"><i class="ln"></i></div></div>
        <div class="mrow" id="mr2" style="top:1220px"><span class="t">September</span><span class="s">vs Amit · 10:44</span><div class="st" id="st2"><i class="ln"></i></div></div>
      </section>

      <!-- 4-5. the app: library, task, countdown -->
      <div class="phone" id="phone" data-layout-allow-overflow data-layout-allow-overlap><div class="screen">
        <div class="island"></div><div class="app" id="app"></div><div class="app" id="app2" style="opacity:0"></div></div></div>

      <!-- 6. let them try -->
      <video id="v6" class="clip full" src="assets/video/v_b_406.mp4" data-start="20.25" data-duration="2.75" data-media-start="0.0" data-track-index="1" muted></video>
      <section id="s6" class="clip" data-start="20.25" data-duration="2.75" data-track-index="4" style="position:absolute;inset:0">
        <div class="shade-top"></div>
        <div class="headline" id="h6"><span class="w">Let</span> <span class="w">them</span> <span class="w hot">try.</span></div>
      </section>

      <div class="capfade" id="capfade"></div>
      <div class="caps" id="caps" data-layout-allow-overlap></div>

      <section id="s-end" class="clip" data-start="22.95" data-duration="1.85" data-track-index="6" style="position:absolute;inset:0">
        <div class="end"><div class="logo" id="logo"></div><div class="tag" id="tag">Find the pattern.</div><div class="url" id="url">matsense.co</div></div>
      </section>
      <audio id="mix" src="assets/audio/mix_ad5.wav" data-start="0" data-duration="24.8" data-track-index="9"></audio>
    </div>

    <script src="assets/kit.js"></script>
    <script src="assets/data/words_ad5.js"></script>
    <script>
      // three match strips: the real events of each match, the guard pass in orange
      const STR = [
        { dur: 685, ev: [[102, "b", "near"], [210, "a", "pen"], [255, "a", "sub"], [262, "b", "sweep"], [335, "b", "pass"], [460, "b", "sub"], [538, "b", "sweepatt"]], hit: 4 },
        { dur: 685, ev: [[48, "b", "pull"], [102, "b", "pass"], [255, "a", "sub"], [335, "b", "sweep"], [500, "a", "pull"]], hit: 1 },
        { dur: 644, ev: [[23, "b", "pull"], [264, "b", "sweep"], [352, "b", "pass"], [358, "a", "sweep"], [412, "b", "sweep"]], hit: 2 },
      ];
      STR.forEach((m, k) => {
        document.getElementById(`st${k}`).insertAdjacentHTML("beforeend", m.ev.map(([t, side, fam], i) =>
          `<i class="tk ${side}" id="tk${k}-${i}" style="left:${(100 * t) / m.dur}%;height:${i === m.hit ? 44 : 26}px;background:var(--ev-${K.FAM[fam]}-mark)"></i>`).join(""));
      });
      const tile = (n) => `assets/img/tiles/t${String(n).padStart(2, "0")}.jpg`;
      const ROWS = [["Guard pass", "Sep · 5:52 · vs Amit", 6], ["Guard pass", "Jun · 1:42 · vs Amit", 21], ["Guard pass", "Mar · 5:35 · vs Amit", 28]];
      document.getElementById("app").innerHTML = `<div class="pad">
        <div class="topbar"><div class="t-title" style="font-size:26px;flex:1">Library</div><div class="circle">${K.icon("plus")}</div></div>
        <div class="tabs3"><span>Tasks</span><span>Notes</span><span class="sel">Folders</span></div>
        <div class="folder card" id="fold"><span class="ic">${K.icon("folder", { color: "#fff", style: "width:26px;height:26px" })}</span>
          <div><div class="nm">Guard passes against me</div><div class="t-sub">Folder · notes from 3 matches</div></div><span class="ct" id="fct">0</span></div>
        <div id="lrows">${ROWS.map((r, i) => `<div class="lib-row card" id="lr${i}"><img src="${tile(r[2])}" alt=""><div style="flex:1">${K.chip("pass", r[0])}<div class="s">${r[1]}</div></div>
          <span style="width:20px;height:20px;color:var(--brand-ink)">${K.icon("bookmark", { fill: true })}</span></div>`).join("")}</div></div>
        <div class="tabbar"><span>${K.icon("home")}</span><span>${K.icon("video")}</span><span style="color:var(--brand-ink)">${K.icon("library")}</span><span class="plus">${K.icon("plus", { sw: 2.4 })}</span></div>`;
      document.getElementById("app2").innerHTML = `<div class="pad">
        <div class="topbar"><div style="flex:1"><div class="t-sub" style="margin:0">Your week</div><div class="t-title" style="font-size:22px">The next competition</div></div></div>
        ${K.taskCard({ id: "tk", n: 1, name: "Keep the guard against the pass", pc: 0, notes: 3, sess: 0 })}
        <div class="card" id="logt" style="margin-top:10px;padding:12px 14px;display:flex;align-items:center;gap:10px">
          <span style="width:20px;height:20px;color:var(--streak)">${K.icon("flame", { fill: true })}</span><span style="font-weight:800;font-size:13.5px;flex:1">Training logged</span>
          <span class="mono" style="font-size:12px;color:var(--ink-muted)">Tue 20:30</span></div>
        <div class="comp card" id="comp"><span style="width:44px;height:44px;color:var(--streak-core)">${K.icon("cup", { style: "width:44px;height:44px" })}</span>
          <div style="flex:1"><div class="label">Next competition</div><div style="font-weight:800;font-size:15px;margin-top:4px">Masters Open</div></div>
          <div style="text-align:right"><div class="big" id="days">21</div><div class="label">days</div></div></div>
        <div style="display:flex;gap:6px;margin-top:10px" id="weeks">${[0, 1, 2].map((i) => `<i id="wkb${i}" style="flex:1;height:8px;border-radius:4px;background:${i === 0 ? "var(--streak)" : "var(--chip)"};display:block"></i>`).join("")}</div></div>`;
      document.getElementById("logo").innerHTML = K.MARK("#ff8a1f") + '<span class="word">Matsense</span>';

      const tl = gsap.timeline({ paused: true });
      const ws = WORDS;
      const W = (w, from) => ws[ws.findIndex((x, j) => j >= (from || 0) && x.text.toLowerCase().startsWith(w))].start;

      // 1. hook
      document.querySelectorAll("#h1 .w").forEach((w, i) =>
        tl.fromTo(w, { opacity: 0, y: 40, scale: 1.2 }, { opacity: 1, y: 0, scale: 1, duration: 0.18, ease: "power3.out" }, ws[i].start - 0.05));
      ["#p1", "#p2", "#p3"].forEach((p, i) => tl.fromTo(p, { opacity: 0, y: 140 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.0 + i * 0.12));
      // 2. not bad luck, a pattern
      [1, 2, 3].forEach((i) => {
        tl.fromTo(`#r${i}`, { opacity: 0 }, { opacity: 1, duration: 0.15 }, W("pattern") - 0.05 + (i - 1) * 0.1);
        tl.fromTo(`#gp${i}`, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.2 }, W("pattern") + (i - 1) * 0.1);
      });
      tl.to("#h1", { opacity: 0, duration: 0.2 }, 2.45);
      // 3. the panels give way to the strips
      tl.to(["#p1", "#p2", "#p3"], { opacity: 0, scale: 0.8, duration: 0.35, ease: "power2.in", stagger: 0.05 }, 5.3);
      [0, 1, 2].forEach((k) => {
        tl.fromTo(`#mr${k}`, { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 5.55 + k * 0.18);
        STR[k].ev.forEach((_, i) => {
          if (i === STR[k].hit) return;
          tl.to(`#tk${k}-${i}`, { opacity: 0.25, duration: 0.3 }, W("finds") - 0.1);
        });
        tl.fromTo(`#tk${k}-${STR[k].hit}`, { scaleY: 1, boxShadow: "0 0 0 0 rgba(242,109,4,0)" },
          { scaleY: 1.5, boxShadow: "0 0 24px 6px rgba(242,109,4,0.9)", duration: 0.25, ease: "back.out(3)" }, W("finds") + k * 0.1);
        tl.to(`#mr${k}`, { borderColor: "rgba(242,109,4,0.8)", duration: 0.3 }, W("finds") + k * 0.1);
      });
      tl.to(["#mr0", "#mr1", "#mr2"], { opacity: 0, y: -60, duration: 0.3, stagger: 0.05 }, 9.55);

      // 4. into the library, filed together
      tl.set("#phone", { opacity: 0 }, 0);
      tl.fromTo("#phone", { opacity: 1, y: 1500 }, { y: 0, duration: 0.55, ease: "power3.out" }, 9.65);
      tl.set("#capfade", { opacity: 0 }, 0);
      tl.to("#capfade", { opacity: 1, duration: 0.3 }, 5.3);
      tl.to("#capfade", { opacity: 0, duration: 0.2 }, 20.2);
      [0, 1, 2].forEach((i) => {
        tl.set(`#lr${i}`, { opacity: 0 }, 0);
        const t = W("filed") + i * 0.32;
        tl.fromTo(`#lr${i}`, { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.28, ease: "power3.out" }, t);
        tl.set("#fct", { textContent: String(i + 1) }, t + 0.1);
        tl.fromTo("#fold", { scale: 1 }, { scale: 1.04, duration: 0.1, yoyo: true, repeat: 1 }, t + 0.05);
      });
      // 5. a task, trained, counted down
      const tTask = W("turn");
      tl.to("#app2", { opacity: 1, duration: 0.3 }, tTask - 0.1);
      tl.to("#app", { opacity: 0, duration: 0.3 }, tTask - 0.1);
      tl.fromTo("#tk", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3 }, tTask + 0.2);
      const tTrain = W("train");
      tl.set(["#logt", "#comp", "#weeks"], { opacity: 0 }, 0);
      tl.fromTo("#logt", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25 }, tTrain - 0.05);
      tl.fromTo("#tk-bar", { scaleX: 0 }, { scaleX: 0.4, duration: 0.6, ease: "power2.out" }, tTrain + 0.1);
      for (let p = 0; p <= 40; p += 5) tl.set("#tk-pc", { textContent: p + "%" }, tTrain + 0.1 + (p / 40) * 0.6);
      tl.set("#tk-sess", { textContent: "3 sessions" }, tTrain + 0.4);
      const tCount = W("count");
      tl.fromTo(["#comp", "#weeks"], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3 }, tCount - 0.05);
      [24, 23, 22, 21].forEach((d, i) => tl.set("#days", { textContent: String(d) }, tCount + 0.2 + i * 0.25));
      tl.to("#phone", { y: 1500, duration: 0.4, ease: "power3.in" }, 19.9);

      // 6. let them try
      document.querySelectorAll("#h6 .w").forEach((w, i) =>
        tl.fromTo(w, { opacity: 0, y: 40, scale: 1.2 }, { opacity: 1, y: 0, scale: 1, duration: 0.2, ease: "power3.out" }, [W("let"), W("them", 40), W("try")][i] - 0.05));
      tl.fromTo("#v6", { scale: 1.12 }, { scale: 1.0, duration: 2.75, ease: "power1.out" }, 20.25);

      K.captions(tl, document.getElementById("caps"), ws, { skip: [[0, 2.5], [20.2, 99]], hot: ["pattern", "months", "library", "filed", "task", "competition"] });

      tl.fromTo("#logo", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 23.0);
      tl.fromTo("#logo .dot", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 23.25);
      tl.fromTo("#tag", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 23.45);
      tl.fromTo("#url", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 23.85);
      window.__timelines["ad5"] = tl;
    </script>
  </body>
</html>
