<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Matsense Reel 4 - Forty minutes of staring</title>
    <script src="assets/js/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit.css" />
    <style>
      #h1 { font-size: 104px; top: 250px; }
      .scrubber { position: absolute; left: 60px; right: 60px; top: 1380px; }
      .scrubber .times { display: flex; justify-content: space-between; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 40px; color: #fff;
        text-shadow: 0 2px 16px rgba(0, 0, 0, 0.8); }
      .scrubber .track { position: relative; height: 12px; border-radius: 6px; background: rgba(255, 255, 255, 0.3); margin-top: 22px; }
      .scrubber .fill { position: absolute; left: 0; top: 0; height: 12px; width: 960px; border-radius: 6px; background: #fff; transform-origin: 0 50%; }
      .scrubber .thumb { position: absolute; left: -22px; top: -16px; width: 44px; height: 44px; border-radius: 50%; background: #fff; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); }
      .stamp { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font-weight: 800; font-size: 210px; letter-spacing: -6px; text-transform: uppercase;
        text-shadow: 0 10px 60px rgba(0, 0, 0, 0.7); }
      .spin { position: absolute; left: 50%; top: 1110px; width: 110px; height: 110px; margin-left: -55px; border-radius: 50%;
        border: 10px solid rgba(255, 255, 255, 0.25); border-top-color: #fff; }
      .counters { position: absolute; left: 70px; right: 70px; top: 640px; display: flex; flex-direction: column; gap: 70px; }
      .ctr .n { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 220px; letter-spacing: -8px; line-height: 1; }
      .ctr .l { font-weight: 800; font-size: 50px; text-transform: uppercase; letter-spacing: 6px; color: var(--ink-muted); margin-top: 10px; }
      #bar { position: absolute; left: 70px; top: 1246px; width: 940px; height: 120px; }
      #bar .seg { position: absolute; top: 0; height: 120px; border-radius: 12px; transform-origin: 0 50%; }
      #bar .dead { background: rgba(255, 255, 255, 0.16); }
      #bar .ev { width: 120px; }
      #bar .tm { position: absolute; top: 140px; width: 120px; text-align: center; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; color: var(--ink-muted); }
      #barlab { position: absolute; left: 70px; right: 70px; top: 1180px; display: flex; justify-content: space-between; font-family: "JetBrains Mono", monospace; font-size: 34px; color: var(--ink-muted); }
      .clock { position: absolute; left: 0; right: 0; top: 700px; text-align: center; }
      .clock .n { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 250px; letter-spacing: -8px; }
      .clock .l { font-weight: 800; font-size: 56px; color: var(--streak-core); margin-top: 6px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ad4" data-start="0" data-width="1080" data-height="1920" data-duration="22.6">
      <!-- 1. scrub, wait, scrub -->
      <video id="v1" class="clip full" src="assets/video/v_a_scrub.mp4" data-start="0" data-duration="4.6" data-media-start="0" data-track-index="1" muted></video>
      <section id="s1" class="clip" data-start="0" data-duration="4.6" data-track-index="3" style="position:absolute;inset:0">
        <div class="shade-top" style="height:760px"></div><div class="shade-bottom"></div>
        <div class="headline" id="h1">This is how you watch your <span class="hot">matches.</span></div>
        <div class="stamp" id="st1">Scrub.</div><div class="stamp" id="st2">Wait.</div><div class="stamp" id="st3">Scrub.</div><div class="spin" id="spin"></div>
        <div class="scrubber"><div class="times"><span id="cur">1:35</span><span>11:25</span></div>
          <div class="track"><i class="fill" id="fill"></i><i class="thumb" id="thumb"></i></div></div>
      </section>
      <!-- 2-3. one match, forty minutes of staring -->
      <video id="v2" class="clip full" src="assets/video/v_a_full_330.mp4" data-start="4.6" data-duration="5.75" data-media-start="0" data-playback-rate="0.6" data-track-index="1" muted></video>
      <section id="s2" class="clip" data-start="4.6" data-duration="5.75" data-track-index="3" style="position:absolute;inset:0">
        <div class="tint" id="t2" style="opacity:0.78"></div>
        <div class="counters" id="ctrs"><div class="ctr" id="c1"><div class="n" id="n1">1</div><div class="l">match</div></div>
          <div class="ctr" id="c2"><div class="n hot" id="n2">00:00</div><div class="l">of staring</div></div></div>
        <div id="greybar" style="position:absolute;left:70px;right:70px;top:1180px;opacity:0">
          <div style="display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:34px;color:var(--ink-muted)"><span>0:00</span><span>11:25</span></div>
          <div style="height:120px;border-radius:12px;background:rgba(255,255,255,0.16);margin-top:16px"></div></div>
      </section>
      <!-- 4. skips the staring -->
      <section id="s4" class="clip" data-start="10.35" data-duration="2.2" data-track-index="3" style="position:absolute;inset:0">
        <div id="barlab"><span>0:00</span><span>11:25</span></div><div id="bar"></div>
      </section>

      <div class="phone" id="phone" data-layout-allow-overflow data-layout-allow-overlap><div class="screen">
        <div class="pv"><video id="pv1" class="clip" src="assets/video/p_a_258.mp4" data-start="12.3" data-duration="5.7" data-media-start="0" data-track-index="5" muted></video>
          <video id="pv2" class="clip" src="assets/video/p_a_258.mp4" data-start="17.0" data-duration="1.4" data-media-start="5.8" data-track-index="5" muted></video></div>
        <div class="island"></div><div class="app" id="app"></div></div></div>
      <div class="tap" id="tap" style="left:540px;top:1300px;opacity:0"></div>

      <!-- 6. lunch break -->
      <video id="v6" class="clip full" src="assets/video/v_a_258z.mp4" data-start="18.3" data-duration="2.45" data-media-start="1.0" data-track-index="1" muted></video>
      <section id="s6" class="clip" data-start="18.3" data-duration="2.45" data-track-index="4" style="position:absolute;inset:0">
        <div class="tint" style="opacity:0.7"></div>
        <div class="clock"><div class="n" id="ck">12:47</div><div class="l" id="ckl">Lunch break. Enough.</div></div>
      </section>

      <div class="capfade" id="capfade"></div>
      <div class="caps" id="caps" data-layout-allow-overlap></div>

      <section id="s-end" class="clip" data-start="20.75" data-duration="1.85" data-track-index="6" style="position:absolute;inset:0">
        <div class="end"><div class="logo" id="logo"></div><div class="tag" id="tag">Skip the staring.</div></div>
      </section>
      <audio id="mix" src="assets/audio/mix_ad4.wav" data-start="0" data-duration="22.6" data-track-index="9"></audio>
    </div>

    <script src="assets/kit.js"></script>
    <script src="assets/data/words_ad4.js"></script>
    <script src="assets/data/scrub.js"></script>
    <script>
      const DUR = 685;
      const EV = [
        { t: 102, side: "b", fam: "near", key: 1 }, { t: 210, side: "a", fam: "pen" }, { t: 255, side: "a", fam: "sub", key: 1 },
        { t: 262, side: "b", fam: "sweep", key: 1 }, { t: 335, side: "b", fam: "pass", key: 1 }, { t: 460, side: "b", fam: "sub" }, { t: 538, side: "b", fam: "sweepatt", key: 1 },
      ];
      document.getElementById("app").innerHTML = K.matchScreen({
        id: "m", title: "Athlete A vs Athlete B", sub: "1 Oct · No-gi · 11:25", a: "Athlete A", b: "Athlete B", duration: DUR, events: EV, tc: "0:00", toSort: "7 to sort",
        rows: [{ t: 102, side: "b", fam: "near", name: "Dangerous pass", who: "Athlete B", pts: "Adv" }, { t: 255, side: "a", fam: "sub", name: "Submission attempt", who: "Athlete A", pts: "Adv" },
               { t: 262, side: "b", fam: "sweep", name: "Sweep", who: "Athlete B", pts: "2 pts" }, { t: 335, side: "b", fam: "pass", name: "Guard pass", who: "Athlete B", pts: "3 pts" }],
      });
      // the dead-time bar: grey stretches and the moments, which close up into a row
      const BW = 940, px = BW / DUR, bar = document.getElementById("bar");
      let html = "", prev = 0;
      const MW = 120, GAP = 14, x0 = (BW - EV.length * MW - (EV.length - 1) * GAP) / 2;
      EV.forEach((e, i) => {
        html += `<i class="seg dead" id="dead-${i}" style="left:${prev * px}px;width:${(e.t - prev) * px - 3}px"></i>`;
        html += `<i class="seg ev" id="ev-${i}" style="left:0;background:var(--ev-${K.FAM[e.fam]}-mark)"></i><span class="tm" id="evt-${i}" style="left:${x0 + i * (MW + GAP)}px">${K.mmss(e.t)}</span>`;
        prev = e.t + 10;
      });
      html += `<i class="seg dead" id="dead-x" style="left:${prev * px}px;width:${(DUR - prev) * px}px"></i>`;
      bar.innerHTML = html;
      document.getElementById("logo").innerHTML = K.MARK("#ff8a1f") + '<span class="word">Matsense</span>';

      const tl = gsap.timeline({ paused: true });
      const ws = WORDS;
      const W = (w, from) => ws[ws.findIndex((x, j) => j >= (from || 0) && x.text.toLowerCase().startsWith(w))].start;

      // 1. the scrub bar follows the real scrub of the clip
      tl.fromTo("#h1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, 0.05);
      tl.to("#h1", { opacity: 0, duration: 0.15 }, 2.75);
      SCRUB.src.forEach((s, i) => {
        const t = i / SCRUB.fps, f = s / SCRUB.duration;
        tl.set("#fill", { scaleX: f }, t);
        tl.set("#thumb", { x: f * 960 }, t);
        if (i % 2 === 0) tl.set("#cur", { textContent: K.mmss(s) }, t);
      });
      ["#st1", "#st2", "#st3"].forEach((s, i) => {
        tl.set(s, { opacity: 0 }, 0);
        const t = [W("scrub"), W("wait"), W("scrub", 10)][i];
        tl.fromTo(s, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power3.out" }, t - 0.04);
        tl.to(s, { opacity: 0, duration: 0.08 }, i < 2 ? [W("wait"), W("scrub", 10)][i] - 0.06 : 4.5);
      });
      tl.set("#spin", { opacity: 0 }, 0);
      tl.set("#spin", { opacity: 1 }, W("wait"));
      tl.fromTo("#spin", { rotation: 0 }, { rotation: 540, duration: 0.45, ease: "none" }, W("wait"));
      tl.set("#spin", { opacity: 0 }, W("scrub", 10) - 0.05);

      // 2. the counters
      const t6 = W("one"), t40 = W("forty");
      tl.fromTo("#c1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25 }, t6 - 0.1);
      tl.fromTo("#c2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25 }, t40 - 0.1);
      for (let m = 0; m <= 40; m++) tl.set("#n2", { textContent: String(m).padStart(2, "0") + ":00" }, t40 + (m / 40) * 1.3);
      // 3. where did it turn: the match as one grey bar
      tl.to("#ctrs", { opacity: 0, y: -40, duration: 0.25 }, W("and") - 0.15);
      tl.fromTo("#greybar", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3 }, W("and"));
      tl.fromTo("#v2", { filter: "saturate(1)" }, { filter: "saturate(0.15)", duration: 2.0 }, 8.0);
      // 4. skips the staring: the grey closes up, the moments remain
      EV.forEach((e, i) => tl.set(`#ev-${i}`, { x: e.t * px, scaleX: (10 * px) / MW }, 0));
      const tSk = W("skips");
      document.querySelectorAll("#bar .dead").forEach((d) => tl.to(d, { scaleX: 0, opacity: 0, duration: 0.5, ease: "power3.inOut" }, tSk));
      EV.forEach((e, i) => {
        tl.to(`#ev-${i}`, { x: x0 + i * (MW + GAP), scaleX: 1, duration: 0.55, ease: "power3.inOut" }, tSk + 0.05);
        tl.fromTo(`#evt-${i}`, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2 }, tSk + 0.5 + i * 0.04);
      });
      tl.to("#barlab", { opacity: 0, duration: 0.3 }, tSk);
      tl.to(["#bar"], { opacity: 0, y: 60, duration: 0.25, ease: "power2.in" }, 12.0);

      // 5. the app: yours above, theirs below; one tap and you're there
      tl.set("#phone", { opacity: 0 }, 0);
      tl.fromTo("#phone", { opacity: 1, y: 1500 }, { y: 0, duration: 0.55, ease: "power3.out" }, 12.15);
      tl.set("#capfade", { opacity: 0 }, 0);
      tl.to("#capfade", { opacity: 1, duration: 0.3 }, 10.4);
      tl.to("#capfade", { opacity: 0, duration: 0.2 }, 18.25);
      document.querySelectorAll("[id^=m-row-]").forEach((r, i) => {
        tl.set(r, { opacity: 0 }, 0);
        tl.fromTo(r, { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, W("marks") + i * 0.25);
      });
      const glow = (sel, t) => tl.fromTo(sel, { scaleY: 1 }, { scaleY: 1.6, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "50% 50%" }, t);
      EV.forEach((e, i) => glow(`#m-tick-${i}`, e.side === "a" ? W("yours") : W("opponent's")));
      const tTap = W("tap");
      tl.set("#tap", { left: 560, top: 1451 }, 0);
      tl.to("#phone", { y: -320, duration: 0.35, ease: "power3.inOut" }, W("one", 30) - 0.4);
      tl.fromTo("#tap", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.16 }, W("one", 30) + 0.05);
      tl.to("#tap", { opacity: 0, scale: 1.6, duration: 0.3 }, W("one", 30) + 0.25);
      tl.to("#m-row-2", { backgroundColor: "rgba(124,116,255,0.22)", borderColor: "#aaa4ff", duration: 0.15 }, W("one", 30) + 0.1);
      tl.set("#m-tc", { textContent: "4:22" }, 17.0);
      tl.fromTo("#m-head", { x: 0 }, { x: (262 / DUR) * 286, duration: 0.35, ease: "power3.inOut" }, 16.75);
      tl.fromTo("#m-prog", { scaleX: 0 }, { scaleX: 262 / DUR, duration: 0.35, ease: "power3.inOut" }, 16.75);
      tl.to("#phone", { scale: 1.12, y: 0, duration: 0.6, ease: "power2.out", transformOrigin: "50% 0%" }, 17.0);
      tl.to("#phone", { y: 1500, duration: 0.4, ease: "power3.in" }, 17.95);

      // 6. lunch break
      tl.fromTo(".clock", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, W("lunch") - 0.2);
      tl.fromTo("#v6", { scale: 1.0 }, { scale: 1.08, duration: 2.45, ease: "none" }, 18.3);

      K.captions(tl, document.getElementById("caps"), ws, { skip: [[0, 4.5], [20.7, 99]], hot: ["forty", "staring", "skips", "yours", "opponent's", "lunch"] });

      tl.fromTo("#logo", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 20.8);
      tl.fromTo("#logo .dot", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 21.05);
      tl.fromTo("#tag", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 21.25);
      window.__timelines["ad4"] = tl;
    </script>
  </body>
</html>
