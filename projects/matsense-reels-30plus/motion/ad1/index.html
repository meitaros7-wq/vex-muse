<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Matsense Reel 1 - Which advantage?</title>
    <script src="assets/js/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit.css" />
    <style>
      .board { position: absolute; left: 90px; right: 90px; top: 1000px; border-radius: 28px; overflow: hidden;
        background: rgba(8, 7, 24, 0.92); border: 2px solid rgba(255, 255, 255, 0.12); box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6); }
      .board .r { display: flex; align-items: center; height: 150px; border-bottom: 2px solid rgba(255, 255, 255, 0.08); }
      .board .r:last-child { border-bottom: 0; }
      .board .flag { width: 22px; align-self: stretch; }
      .board .nm { flex: 1; padding-left: 34px; font-weight: 800; font-size: 52px; letter-spacing: -1px; }
      .board .pt { width: 170px; text-align: center; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 96px; }
      .board .sm { width: 150px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
        border-left: 2px solid rgba(255, 255, 255, 0.08); }
      .board .sm b { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 62px; line-height: 1; }
      .board .sm span { font-size: 20px; font-weight: 800; letter-spacing: 3px; color: var(--ink-subtle); margin-top: 6px; }
      #adv-hot { position: relative; }
      #adv-ring { position: absolute; inset: 10px; border-radius: 18px; border: 5px solid var(--danger); box-shadow: 0 0 40px rgba(255, 90, 90, 0.8); opacity: 0; }
      .q { position: absolute; left: 0; right: 0; top: 1010px; text-align: center; }
      .q .tcode { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 64px; padding: 12px 34px; border-radius: 50px;
        background: rgba(8, 7, 24, 0.82); border: 2px solid rgba(255, 255, 255, 0.2); }
      #whiteout { position: absolute; inset: 0; background: #f4f2ff; opacity: 0; }
      #fixcard { position: absolute; left: 40px; right: 40px; top: 900px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ad1" data-start="0" data-width="1080" data-height="1920" data-duration="22.9">
      <!-- 1. hook: lost by one advantage -->
      <video id="v1" class="clip full" src="assets/video/v_b_352.mp4" data-start="0" data-duration="2.45" data-media-start="5.0" data-track-index="1" muted></video>
      <!-- 2. which one: four quick looks -->
      <video id="v2a" class="clip full" src="assets/video/v_b_406.mp4" data-start="2.45" data-duration="0.5" data-media-start="5.6" data-track-index="1" muted></video>
      <video id="v2b" class="clip full" src="assets/video/v_a_258z.mp4" data-start="2.95" data-duration="0.45" data-media-start="6.5" data-track-index="1" muted></video>
      <video id="v2c" class="clip full" src="assets/video/v_b_258.mp4" data-start="3.4" data-duration="0.45" data-media-start="5.8" data-track-index="1" muted></video>
      <video id="v2d" class="clip full" src="assets/video/v_a_538z.mp4" data-start="3.85" data-duration="0.5" data-media-start="4.4" data-track-index="1" muted></video>
      <!-- 3. adrenaline wipes it -->
      <video id="v3" class="clip full" src="assets/video/v_b_352.mp4" data-start="4.35" data-duration="4.75" data-media-start="0" data-playback-rate="1.6" data-track-index="1" muted></video>

      <section id="s-shade" class="clip" data-start="0" data-duration="9.1" data-track-index="2" style="position:absolute;inset:0">
        <div class="shade-top"></div><div class="shade-bottom" style="height:500px"></div>
      </section>

      <section id="s1" class="clip" data-start="0" data-duration="4.35" data-track-index="3" style="position:absolute;inset:0">
        <div class="headline" id="h1"><span class="w">You</span> <span class="w">lost</span> <span class="w">by</span> <span class="w">one</span> <span class="w hot">advantage.</span></div>
        <div class="board" id="board">
          <div class="r"><span class="flag" style="background:#fff"></span><span class="nm">MEITAR</span><span class="pt">2</span>
            <span class="sm"><b>0</b><span>ADV</span></span><span class="sm"><b>0</b><span>PEN</span></span></div>
          <div class="r"><span class="flag" style="background:#4a52c4"></span><span class="nm">AMIT</span><span class="pt">2</span>
            <span class="sm" id="adv-hot"><i id="adv-ring"></i><b id="adv-n" style="color:var(--danger)">1</b><span>ADV</span></span><span class="sm"><b>0</b><span>PEN</span></span></div>
        </div>
        <div class="headline" id="h2" style="top:300px;opacity:0"><span class="w">Which</span> <span class="w hot">one?</span></div>
        <div class="q" id="q"><span class="tcode" id="qt">4:24</span></div>
      </section>

      <div id="whiteout"></div>

      <!-- 4-6. the app -->
      <div class="phone" id="phone" data-layout-allow-overflow data-layout-allow-overlap><div class="screen">
        <div class="pv">
          <video id="pv1" class="clip" src="assets/video/p_a_258.mp4" data-start="9.1" data-duration="9.6" data-media-start="0" data-track-index="5" muted></video>
          <video id="pv2" class="clip" src="assets/video/p_a_538.mp4" data-start="18.7" data-duration="1.55" data-media-start="5.0" data-track-index="5" muted></video>
        </div>
        <div class="island"></div><div class="app" id="app"></div></div></div>
      <section id="s-fix" class="clip" data-start="19.0" data-duration="1.3" data-track-index="4" style="position:absolute;inset:0">
        <div class="scrim" id="fixscrim"></div>
        <div id="fixcard" data-layout-allow-overlap></div>
      </section>
      <div class="tap" id="tap" style="left:540px;top:1500px;opacity:0"></div>

      <div class="capfade" id="capfade"></div>
      <div class="caps" id="caps" data-layout-allow-overlap></div>

      <!-- 7. end card -->
      <section id="s-end" class="clip" data-start="20.25" data-duration="2.65" data-track-index="6" style="position:absolute;inset:0">
        <div class="end"><div class="logo" id="logo"></div><div class="tag" id="tag">Know what happened.</div><div class="url" id="url">matsense.co</div></div>
      </section>

      <audio id="mix" src="assets/audio/mix_ad1.wav" data-start="0" data-duration="22.9" data-track-index="9"></audio>
    </div>

    <script src="assets/kit.js"></script>
    <script src="assets/data/words_ad1.js"></script>
    <script>
      const E = [
        { t: 102, side: "b", fam: "near", key: 1 }, { t: 210, side: "a", fam: "pen" }, { t: 255, side: "a", fam: "sub", key: 1 },
        { t: 262, side: "b", fam: "sweep", key: 1 }, { t: 335, side: "b", fam: "pass", key: 1 }, { t: 460, side: "b", fam: "sub" },
        { t: 538, side: "b", fam: "sweepatt", key: 1 },
      ];
      const rows = [
        { t: 335, side: "b", fam: "pass", name: "Guard pass", who: "Amit", pts: "3 pts" },
        { t: 262, side: "b", fam: "sweep", name: "Sweep", who: "Amit", pts: "2 pts" },
        { t: 538, side: "b", fam: "sweepatt", name: "Sweep attempt", who: "Amit", pts: "Adv" },
      ];
      document.getElementById("app").innerHTML = K.matchScreen({
        id: "m", title: "Meitar vs Amit", sub: "1 Oct · No-gi · 11:25", a: "Meitar", b: "Amit", duration: 685, events: E, rows, tc: "4:16", toSort: "7 to sort",
      });
      document.getElementById("fixcard").innerHTML =
        '<div style="transform:scale(2.3);transform-origin:50% 0;width:390px;margin:0 auto">' +
        K.taskCard({ id: "tk", n: 1, name: "Stop the single-leg sweep", pc: 0, notes: 1, sess: 0 }) + "</div>";
      document.getElementById("logo").innerHTML = K.MARK("#ff8a1f") + '<span class="word">Matsense</span>';

      const tl = gsap.timeline({ paused: true });
      const ws = WORDS;
      const at = (i) => ws[i].start;

      // 1. hook
      document.querySelectorAll("#h1 .w").forEach((w, i) =>
        tl.fromTo(w, { opacity: 0, y: 40, scale: 1.2 }, { opacity: 1, y: 0, scale: 1, duration: 0.18, ease: "power3.out" }, at(i) - 0.05));
      tl.fromTo("#board", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.0);
      tl.fromTo("#adv-ring", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)" }, at(4));
      tl.fromTo("#adv-n", { scale: 1 }, { scale: 1.35, duration: 0.16, yoyo: true, repeat: 3, ease: "power1.inOut" }, at(4) + 0.1);
      tl.fromTo("#v1", { scale: 1.0 }, { scale: 1.08, duration: 2.45, ease: "none" }, 0);
      // 2. which one
      tl.to("#h1", { opacity: 0, duration: 0.12 }, 2.4);
      tl.to("#board", { opacity: 0, y: -40, duration: 0.15 }, 2.4);
      tl.set("#h2", { opacity: 1 }, 2.45);
      document.querySelectorAll("#h2 .w").forEach((w, i) =>
        tl.fromTo(w, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.16, ease: "power3.out" }, at(5 + i) - 0.05));
      const qs = ["4:24", "5:58", "6:52", "8:58"], qt = [2.45, 2.95, 3.4, 3.85];
      tl.set("#q", { opacity: 0 }, 0);
      qs.forEach((q, i) => {
        tl.set("#qt", { textContent: q }, qt[i]);
        tl.fromTo("#q", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.12 }, qt[i]);
      });
      ["#v2a", "#v2b", "#v2c", "#v2d"].forEach((v, i) => tl.fromTo(v, { scale: 1.12 }, { scale: 1.0, duration: 0.5, ease: "power2.out" }, qt[i]));
      // 3. adrenaline wipes it: the match smears to white
      tl.fromTo("#v3", { filter: "blur(0px) saturate(1)" }, { filter: "blur(18px) saturate(0.2)", duration: 1.6, ease: "power2.in" }, 7.4);
      tl.fromTo("#whiteout", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.in" }, 8.45);
      tl.to("#whiteout", { opacity: 0, duration: 0.35, ease: "power2.out" }, 9.1);

      // 4. the phone rises; ticks and rows land on "pass", "sweep", "almost"
      tl.set("#phone", { opacity: 0 }, 0);
      tl.set("#capfade", { opacity: 0 }, 0);
      tl.to("#capfade", { opacity: 1, duration: 0.4 }, 9.3);
      tl.to("#capfade", { opacity: 0, duration: 0.2 }, 20.2);
      tl.fromTo("#phone", { opacity: 1, y: 1500, rotation: 4 }, { y: 0, rotation: 0, duration: 0.7, ease: "power3.out" }, 9.1);
      const word = (w, from) => ws.findIndex((x, j) => j >= (from || 0) && x.text.toLowerCase().startsWith(w));
      const iPass = word("pass", 20), iSweep = word("sweep", 20), iAlmost = word("almost", 20), iMarked = word("marked", 20);
      document.querySelectorAll(".ev-tick").forEach((t) => tl.set(t, { opacity: 0 }, 0));
      document.querySelectorAll("[id^=m-row-]").forEach((r) => tl.set(r, { opacity: 0 }, 0));
      const pop = (sel, t) => tl.fromTo(sel, { opacity: 0, scaleY: 0, transformOrigin: "50% 100%" }, { opacity: 1, scaleY: 1, duration: 0.25, ease: "back.out(2.5)" }, t);
      const rowIn = (sel, t) => tl.fromTo(sel, { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, t);
      pop("#m-tick-4", at(iPass)); rowIn("#m-row-0", at(iPass));
      pop("#m-tick-3", at(iSweep)); rowIn("#m-row-1", at(iSweep));
      pop("#m-tick-6", at(iAlmost)); pop("#m-tick-0", at(iAlmost) + 0.12); rowIn("#m-row-2", at(iAlmost));
      [1, 2, 5].forEach((k, j) => pop(`#m-tick-${k}`, at(iMarked) + j * 0.12));
      tl.fromTo("#m-head", { x: 0 }, { x: 0.385 * 286, duration: 6.0, ease: "none" }, 9.6);
      tl.fromTo("#m-prog", { scaleX: 0 }, { scaleX: 0.385, duration: 6.0, ease: "none" }, 9.6);

      // 5. including the one that cost you: push in on the advantage
      const iInc = word("including", 30);
      tl.set("#phone", { transformOrigin: "50% 0%" }, 0);
      tl.to("#phone", { scale: 1.32, y: -470, duration: 0.9, ease: "power3.inOut" }, at(iInc) - 0.1);
      tl.to("#m-row-2", { borderColor: "#ff7b7b", backgroundColor: "rgba(255,123,123,0.16)", duration: 0.3 }, at(iInc) + 0.6);
      tl.to("#m-tick-6", { boxShadow: "0 0 10px 3px rgba(255,123,123,0.9)", backgroundColor: "#ff7b7b", duration: 0.3 }, at(iInc) + 0.6);
      tl.to(["#m-row-0", "#m-row-1"], { opacity: 0.35, duration: 0.3 }, at(iInc) + 0.6);

      // 6. tap it, watch it, fix it
      const iTap = word("tap", 34), iWatch = word("watch", 34), iFix = word("fix", 34);
      tl.set("#tap", { left: 600, top: 1675 }, 0);
      tl.fromTo("#tap", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.18 }, at(iTap));
      tl.to("#tap", { opacity: 0, scale: 1.6, duration: 0.3 }, at(iTap) + 0.2);
      tl.to("#m-row-2", { scale: 0.97, duration: 0.08, yoyo: true, repeat: 1 }, at(iTap));
      tl.set("#m-tc", { textContent: "8:58" }, 18.7);
      tl.to("#phone", { scale: 1.0, y: 0, duration: 0.5, ease: "power3.inOut" }, at(iWatch) - 0.15);
      tl.fromTo("#fixscrim", { opacity: 0 }, { opacity: 1, duration: 0.25 }, at(iFix) - 0.05);
      tl.fromTo("#fixcard", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, at(iFix) - 0.05);
      tl.fromTo("#tk-bar", { scaleX: 0 }, { scaleX: 0.12, duration: 0.6, ease: "power2.out" }, at(iFix) + 0.3);
      tl.to("#phone", { opacity: 0, duration: 0.2 }, 20.2);

      // captions (the hook carries its own type; the end card names the brand)
      K.captions(tl, document.getElementById("caps"), ws, { skip: [[0, 4.3], [20.2, 99]], hot: ["adrenaline", "almost", "cost", "fix"] });

      // 7. end card
      tl.fromTo("#logo", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 20.3);
      tl.fromTo("#logo .dot", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 20.55);
      tl.fromTo("#tag", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 20.7);
      tl.fromTo("#url", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 21.6);

      window.__timelines["ad1"] = tl;
    </script>
  </body>
</html>
